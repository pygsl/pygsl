name: Publish pygsl to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev swig

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Test package installation
        run: |
          python -m venv /tmp/pygsl-test-venv
          /tmp/pygsl-test-venv/bin/python -m pip install --upgrade pip
          /tmp/pygsl-test-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/pygsl-test-venv/bin/python -c "import pygsl"

      - name: Store distribution
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pygsl

    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes ""
          fi

      - name: Upload distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

